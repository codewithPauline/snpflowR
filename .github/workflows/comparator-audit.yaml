name: Comparator-audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp
          needs: check
      - name: Install snpflowR
        run: R CMD INSTALL .
      - name: Verify pinned sources and run point-estimator comparison
        run: Rscript validation/run_comparator_audit.R
      - name: Retain comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-results
          path: |
            validation/results/comparator-*
          if-no-files-found: error
